# golangci-lint v2 configuration (docs/desenvolvimento/convencoes.md#estilo).
# tools/testrun runs it in the fast and full suites; tools/codecheck keeps
# only the rule the linter does not cover (t.Parallel in subtests).
version: "2"

linters:
  default: none
  enable:
    - govet
    - staticcheck
    - errcheck
    - forbidigo
    - paralleltest
    - depguard
  settings:
    paralleltest:
      # Subtests are tools/codecheck's rule alone ("each rule in one tool"):
      # it also covers helpers with a *testing.T parameter.
      ignore-missing-subtests: true
    forbidigo:
      analyze-types: true # also catches an aliased time import
      forbid:
        - pattern: ^time\.(Sleep|Now|After|NewTimer|NewTicker|AfterFunc|Since|Until|Tick)$
          msg: use the injectable clock in pkg/clock (docs/qualidade/testes.md)
        - pattern: ^context\.(WithTimeout|WithTimeoutCause|WithDeadline|WithDeadlineCause)$
          msg: use clock.WithTimeout from pkg/clock, driven by the injectable clock (docs/qualidade/testes.md)
        # Backstop of the fast-suite guard: dialing, listening and starting
        # processes belong to the designated layers (see exclusions below).
        - pattern: ^net\.(Dial|DialTimeout|DialTCP|DialUDP|DialIP|DialUnix|Listen|ListenPacket|ListenTCP|ListenUDP|ListenIP|ListenUnix|ListenUnixgram|ListenMulticastUDP|Dialer|ListenConfig)$
          msg: network dialing and listening belong to the designated layers (docs/qualidade/testes.md#regras-e-erros)
        - pattern: ^os\.StartProcess$
          msg: starting processes belongs to the designated layers (docs/qualidade/testes.md#regras-e-erros)
    depguard:
      rules:
        no-processes-outside-designated-layers:
          files:
            - $all
            - "!**/internal/terminal/**"
            - "!**/internal/gitx/**"
            - "!**/internal/launcher/**"
            - "!**/internal/winsvc/**"
            - "!**/internal/testkit/**"
            - "!**/internal/realaccount/**"
            - "!**/cmd/**"
            - "!**/tools/**"
            - "!**/*_full_test.go"
            - "!**/*_heavy_test.go"
          deny:
            - pkg: os/exec
              desc: processes start only in the designated layers, which carry the fast-suite guard (docs/qualidade/testes.md#regras-e-erros)
        no-testkit-in-production:
          files:
            - $all
            - "!$test"
            - "!**/internal/testkit/**"
            - "!**/cmd/fakeagent/**"
            - "!**/tools/**"
          deny:
            - pkg: github.com/lucasndas/mestre/internal/testkit
              desc: test doubles are for tests only (docs/qualidade/dubles.md)
        guardian-isolated:
          files:
            - "**/guardian/**"
            - "!$test"
          list-mode: strict
          allow:
            - $gostd
            - github.com/lucasndas/mestre/pkg/clock
            - github.com/lucasndas/mestre/guardian
            - golang.org/x/sys
            - golang.org/x/crypto
            - github.com/kardianos/service
            - github.com/coder/websocket
            - github.com/coreos/go-systemd
            - aead.dev/minisign
            - github.com/brutella/dnssd
  exclusions:
    paths:
      - tools/spikes/ # spike code: kept for reference, never imported (docs/desenvolvimento/convencoes.md)
      - tools/winsandbox/spikes/
    presets:
      - std-error-handling # unchecked Close, Flush and fmt.Fprint*
    rules:
      - path: pkg/clock/
        linters:
          - forbidigo
      # Dialing and listening: the layers that own connections.
      - path: ^(internal/(terminal|launcher|winsvc|localchan|transport|testkit|realaccount)|cmd|tools)/
        text: designated layers
        linters:
          - forbidigo

formatters:
  enable:
    - gofmt
    - goimports
