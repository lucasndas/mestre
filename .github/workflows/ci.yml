# CI of the repository: the fast and full suites on Linux and Windows, in
# parallel, required by the ruleset of main (docs/desenvolvimento/ambiente.md
# and docs/qualidade/testes.md). The `test` jobs run the Go side only and need
# no Node; the `web` jobs run the web side (Vitest, Biome, tsc, the build) and
# always run, because a required check that is skipped blocks the merge queue;
# `e2e` smoke-tests the bundle `web` built, in a real browser. The `test` jobs
# build and vet with cgo off, like the release builds. A pull request that changes only documents runs the
# document checks and the tests that read documents. The race detector
# (budgets times 3) runs in its own job, in parallel with the tests and with a
# cache of its own, on the batches of the merge queue, on the pushes to main
# and by hand, not on pull requests: neither does the pre-push hook. The merge
# queue (merge_group) runs everything on the batch before it reaches main.
# Third-party actions are pinned by commit SHA; golangci-lint is the pinned
# release binary, checked by its SHA-256.
name: CI

on:
  pull_request:
  merge_group:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # A push to main is never cancelled: its run is the one with the race
  # detector.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GOLANGCI_LINT_VERSION: 2.14.0

jobs:
  test:
    # The ruleset of main requires these two check names.
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      # Byte-identical checkout on Windows too: gofmt and docscheck expect LF.
      - name: Keep LF line endings
        run: git config --global core.autocrlf false

      # The real-time scan of Microsoft Defender reads every file the checkout,
      # the Go toolchain, the compiler and the tests write; the runner is
      # discarded after the job. First, so the checkout and setup-go are not
      # scanned either.
      - name: No real-time scan (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Set-MpPreference -DisableRealtimeMonitoring $true

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The merge commit of a pull request and its first parent, the
          # base: enough to list the changed files.
          fetch-depth: 2

      # Only documents: docs/, the Markdown files of the root and LICENSE.
      # Every other path (Markdown inside a package can be embedded or test
      # data) runs everything. The push to main always runs everything.
      - name: What the change touches
        run: |
          code=true
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            files=$(git diff --no-renames --name-only HEAD^1 HEAD)
            echo "$files"
            if [ -n "$files" ] && ! printf '%s\n' "$files" | grep -qvE '^docs/|^[^/]+\.md$|^LICENSE$'; then
              code=false
            fi
          fi
          echo "code=$code"
          echo "CODE=$code" >> "$GITHUB_ENV"

      # The build, module and lint caches live on the work disk (on Windows
      # the default places are on the slower system disk C:) and are kept by
      # the cache steps below, not by setup-go: its cache has one key per
      # go.sum, saved once and never refreshed, so it goes stale as the code
      # moves.
      - name: Caches on the work disk
        run: |
          echo "GOCACHE=$RUNNER_TEMP/go-build" >> "$GITHUB_ENV"
          echo "GOMODCACHE=$RUNNER_TEMP/go-mod" >> "$GITHUB_ENV"
          echo "GOLANGCI_LINT_CACHE=$RUNNER_TEMP/golangci-lint" >> "$GITHUB_ENV"

      # Uses the toolchain line of go.mod.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      # The caches of the last push to main (or the closest older one): only
      # what this change touches is compiled and analysed again. A push to
      # main saves a new entry after the suites (the race detector runs in
      # another job and has no part in it).
      - name: Restore the caches
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ runner.temp }}/go-build
            ${{ runner.temp }}/go-mod
            ${{ runner.temp }}/golangci-lint
          key: ci-${{ runner.os }}-${{ env.GOLANGCI_LINT_VERSION }}-${{ hashFiles('go.sum', '.golangci.yml') }}-${{ github.sha }}
          restore-keys: |
            ci-${{ runner.os }}-${{ env.GOLANGCI_LINT_VERSION }}-${{ hashFiles('go.sum', '.golangci.yml') }}-
            ci-${{ runner.os }}-${{ env.GOLANGCI_LINT_VERSION }}-

      # The temporary folder of the Windows runner is on the system disk (C:),
      # several times slower than the work disk (D:) for what the tests do
      # all the time: creating files and databases, flushes. The Go build
      # directories and every t.TempDir() live in it.
      - name: Temporary files on the work disk (Windows)
        if: runner.os == 'Windows'
        run: |
          echo "TEMP=$RUNNER_TEMP" >> "$GITHUB_ENV"
          echo "TMP=$RUNNER_TEMP" >> "$GITHUB_ENV"

      - name: Install golangci-lint (Linux)
        if: env.CODE == 'true' && runner.os == 'Linux'
        run: |
          f="golangci-lint-$GOLANGCI_LINT_VERSION-linux-amd64"
          cd "$RUNNER_TEMP"
          curl -fsSLO "https://github.com/golangci/golangci-lint/releases/download/v$GOLANGCI_LINT_VERSION/$f.tar.gz"
          echo "ab90aeb7b066f92a33415b638a50fe5344bbb75a0d32ad30cc248d88f81032ab  $f.tar.gz" | sha256sum -c -
          tar -xzf "$f.tar.gz"
          echo "$RUNNER_TEMP/$f" >> "$GITHUB_PATH"

      - name: Install golangci-lint (Windows)
        if: env.CODE == 'true' && runner.os == 'Windows'
        shell: pwsh
        run: |
          $f = "golangci-lint-$env:GOLANGCI_LINT_VERSION-windows-amd64"
          $zip = Join-Path $env:RUNNER_TEMP "$f.zip"
          Invoke-WebRequest -Uri "https://github.com/golangci/golangci-lint/releases/download/v$env:GOLANGCI_LINT_VERSION/$f.zip" -OutFile $zip
          $sum = (Get-FileHash -Algorithm SHA256 -Path $zip).Hash.ToLowerInvariant()
          if ($sum -ne 'b15f903d1649283a2ab6e8d2f0c317eaf1f9f6b3763950e7e8b7e72a43dd724f') { throw "golangci-lint checksum mismatch: $sum" }
          Expand-Archive -Path $zip -DestinationPath $env:RUNNER_TEMP
          Add-Content -Path $env:GITHUB_PATH -Value (Join-Path $env:RUNNER_TEMP $f)

      - name: golangci-lint version
        if: env.CODE == 'true'
        run: golangci-lint version


      - name: Documentation check
        run: go run ./tools/docscheck

      - name: Code rules
        run: go run ./tools/codecheck

      # A change of documents only: the tests that read a document (the
      # glossary, the messages of the protocol, the ruleset, the session
      # zero), found by the path they open, and the tests of the document
      # check; the push to main runs everything anyway.
      - name: Tests that read documents
        if: env.CODE != 'true'
        run: |
          pkgs=$(grep -rlE --include='*_test.go' '"(\.\./)+docs/|"\.\.", "\.\.", "docs"' internal tools cmd pkg | xargs -n1 dirname | sort -u | sed 's|^|./|')
          echo $pkgs
          # The same guard as the suites: no external process in the fast one
          # (docs/qualidade/testes.md#regras-e-erros).
          MESTRE_TEST_SUITE=fast go test ./tools/docscheck $pkgs
          MESTRE_TEST_SUITE=full go test -tags full ./tools/docscheck $pkgs

      # The release binaries are built with cgo off (ADR 0001): the same build
      # and vet must pass that way too, on both systems.
      - name: Build and vet with cgo off
        if: env.CODE == 'true'
        env:
          CGO_ENABLED: "0"
        run: |
          go build ./...
          go vet ./...

      # The suite budgets are measured with a warm build cache
      # (docs/qualidade/testes.md#executor-testrun): compile the test
      # binaries of both suites first, running no test.
      - name: Warm the build cache
        if: env.CODE == 'true'
        run: |
          go test -run '^$' ./...
          go test -tags full -run '^$' ./...
          # TestDropAmbientRunsWithoutCgo builds the launcher tests with cgo off.
          CGO_ENABLED=0 go test -run '^$' ./internal/launcher/

      # Like the build cache, the analysis cache of the linter is warm when
      # the suites are measured: the packages this change touches are analysed
      # here, not inside the budget of the fast and the full suite (both run
      # the linter, the full one with the tag).
      - name: Warm the lint cache
        if: env.CODE == 'true'
        run: |
          golangci-lint run ./...
          golangci-lint run --build-tags full ./...

      - name: Fast suite
        if: env.CODE == 'true'
        run: go run ./tools/testrun fast -only go

      - name: EXPERIMENT timing (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          go test -tags zz -count=1 -v -run TestZZ ./internal/testkit/guildtpl | Select-String 'ZZ'
          go test -tags zz -count=1 -v -run TestZZ ./internal/testkit/guildtpl | Select-String 'ZZ'

      - name: Full suite
        if: env.CODE == 'true' && false
        run: go run ./tools/testrun full -only go

      # Only main's runs save: a cache saved on the temporary branch of a
      # batch of the merge queue is seen by no other branch.
      - name: Save the caches
        if: success() && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ runner.temp }}/go-build
            ${{ runner.temp }}/go-mod
            ${{ runner.temp }}/golangci-lint
          key: ci-${{ runner.os }}-${{ env.GOLANGCI_LINT_VERSION }}-${{ hashFiles('go.sum', '.golangci.yml') }}-${{ github.sha }}

  # The web side of the fast suite (docs/qualidade/testes.md#executor-testrun)
  # and the production build, on both systems. No path filter: it runs on every
  # change, so the required check always exists. Needs no Go cache: the runner
  # is a small program.
  web:
    name: web (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - name: Keep LF line endings
        run: git config --global core.autocrlf false

      - name: No real-time scan (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Set-MpPreference -DisableRealtimeMonitoring $true

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      # The version is the one of web/.nvmrc and engines (Node 26).
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install the packages
        working-directory: web
        run: npm ci

      # Vitest, Biome and tsc side by side, inside the 15 s budget of the web
      # side; the Go side does not run here.
      - name: Web side of the fast suite
        run: go run ./tools/testrun fast -only web

      - name: Build the bundle
        working-directory: web
        run: npm run build

      # One bundle is enough for the smoke tests: the build is the same on
      # both systems.
      - name: Upload the bundle
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-dist
          path: internal/panel/webdist/
          if-no-files-found: error
          retention-days: 3

  # Smoke test of the panel in a real browser (headless Chromium), on the
  # bundle of the `web` job. The time of the job is measured, not limited
  # (docs/qualidade/testes.md#smoke-do-painel).
  e2e:
    name: e2e (${{ matrix.os }})
    needs: web
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - name: Keep LF line endings
        run: git config --global core.autocrlf false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: web-dist
          path: internal/panel/webdist

      - name: Install the packages
        working-directory: web
        run: npm ci

      - name: Install Chromium (Linux)
        if: runner.os == 'Linux'
        working-directory: web
        run: npx --no-install playwright install --with-deps chromium

      - name: Install Chromium (Windows)
        if: runner.os == 'Windows'
        working-directory: web
        run: npx --no-install playwright install chromium

      - name: Smoke test
        working-directory: web
        run: |
          start=$SECONDS
          npm run e2e
          took=$((SECONDS - start))
          echo "e2e smoke test: ${took}s"
          echo "### e2e smoke test (${{ matrix.os }}): ${took}s" >> "$GITHUB_STEP_SUMMARY"

  # The race detector (docs/qualidade/testes.md, step 9) in a job of its own:
  # off the path of the required checks, which are the jobs above. Its build
  # artifacts (cgo, -race) live in a cache of their own, so the cache of the
  # tests stays small. Only on the pushes to main and by hand.
  race:
    name: race (ubuntu-latest)
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Caches on the work disk
        run: |
          echo "GOCACHE=$RUNNER_TEMP/go-build" >> "$GITHUB_ENV"
          echo "GOMODCACHE=$RUNNER_TEMP/go-mod" >> "$GITHUB_ENV"

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Restore the caches
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ runner.temp }}/go-build
            ${{ runner.temp }}/go-mod
          key: ci-race-${{ runner.os }}-${{ hashFiles('go.sum') }}-${{ github.sha }}
          restore-keys: |
            ci-race-${{ runner.os }}-${{ hashFiles('go.sum') }}-
            ci-race-${{ runner.os }}-

      # The detector needs cgo and a build cache of its own; compile the race
      # test binaries first, so the budgets (3x the normal ones) measure tests.
      - name: Warm the build cache (race)
        run: |
          go test -race '-gcflags=modernc.org/...=-d=checkptr=0 -race=0' -run '^$' ./...
          go test -race '-gcflags=modernc.org/...=-d=checkptr=0 -race=0' -tags full -run '^$' ./...

      # Right after the warm-up, so a race found by the suites below does not
      # lose the cache; only main's runs save (see the job above).
      - name: Save the caches
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ runner.temp }}/go-build
            ${{ runner.temp }}/go-mod
          key: ci-race-${{ runner.os }}-${{ hashFiles('go.sum') }}-${{ github.sha }}

      - name: Fast suite (race)
        run: go run ./tools/testrun fast -race

      - name: Full suite (race)
        run: go run ./tools/testrun full -race
