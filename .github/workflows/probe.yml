name: probe
on:
  pull_request:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          id; echo "XDG_RUNTIME_DIR=$XDG_RUNTIME_DIR"; ls -ld /run/user/* || true
          systemctl --version | head -1 || true
          cat /sys/fs/cgroup/cgroup.controllers || true; stat -fc %T /sys/fs/cgroup
          systemd-run --user --scope --quiet -p Delegate=yes -- true; echo "systemd-run exit=$?"
          loginctl list-sessions || true
          cat /proc/self/cgroup
