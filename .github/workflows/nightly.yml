# Nightly jobs of docs/qualidade/testes.md (quarantine, flaky hunt and the
# check of the ruleset of main), described in docs/desenvolvimento/ambiente.md.
# Third-party actions are pinned by commit SHA, like ci.yml. The jobs that run
# repository code only read the repository; only the two report jobs may write
# issues, and they run no repository code.
name: Nightly

on:
  schedule:
    - cron: "23 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly
  cancel-in-progress: false

jobs:
  # `testrun quarantine`: each quarantined test 20 times; the ::notice and
  # the job summary say which ones may leave (test/quarantine.yaml).
  quarantine:
    name: quarantine (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - name: Keep LF line endings
        run: git config --global core.autocrlf false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Run the quarantined tests 20 times
        run: go run ./tools/testrun quarantine

  # `testrun fast -count 5 -shuffle`: a test that passes and fails in the same
  # run is flaky. The lines "mixed: <package> <Test> passed N failed M" go to
  # an artifact for the report job.
  flaky-hunt:
    name: flaky hunt (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - name: Keep LF line endings
        run: git config --global core.autocrlf false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      # The budget (scaled by -count) is measured with a warm build cache.
      - name: Warm the build cache
        run: go test -run '^$' ./...

      - name: Run the fast suite five times, shuffled
        run: |
          set +e
          go run ./tools/testrun fast -count 5 -shuffle 2>&1 | tee hunt.log
          code=${PIPESTATUS[0]}
          mkdir -p flaky
          grep '^mixed: ' hunt.log > "flaky/${{ matrix.os }}.txt" || true
          exit "$code"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: flaky-${{ matrix.os }}
          path: flaky/
          if-no-files-found: ignore

  # One issue labeled `flaky` per test with mixed results (a comment when it
  # is already open). The only job with write access, and it runs no
  # repository code: just the gh CLI of the runner.
  report:
    name: report flaky tests
    needs: flaky-hunt
    if: always() && needs.flaky-hunt.result != 'skipped'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: flaky-*
          path: flaky
          merge-multiple: true

      - name: Open or update the flaky issues
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          gh label create flaky --description "Test with mixed results (nightly flaky hunt)" --color D93F0B 2>/dev/null || true
          for f in flaky/*.txt; do
            os=$(basename "$f" .txt)
            while read -r _ pkg test _ passed _ failed; do
              title="flaky: $test"
              body="Nightly flaky hunt on $os (\`testrun fast -count 5 -shuffle\`): \`$test\` in \`$pkg\` passed $passed and failed $failed of 5 runs. Run: $RUN_URL

          Fix it, or quarantine it in \`test/quarantine.yaml\` with this issue (docs/qualidade/testes.md)."
              number=$(gh issue list --label flaky --state open --search "\"$title\" in:title" --json number,title \
                --jq "map(select(.title == \"$title\")) | first | .number // empty")
              if [ -n "$number" ]; then
                gh issue comment "$number" --body "$body"
              else
                gh issue create --label flaky --title "$title" --body "$body"
              fi
            done < "$f"
          done

  # `tools/rulesetcheck`: the live ruleset of main against the JSON block of
  # docs/desenvolvimento/ambiente.md (the single source). The verdict goes to
  # an artifact: ruleset/result is ok, drift or error (the default, if the job
  # dies before the end) and ruleset/drift.txt lists the differences.
  ruleset:
    name: ruleset of main
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Compare the live ruleset with the documented one
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir ruleset
          echo error > ruleset/result
          : > ruleset/drift.txt
          list=$(gh api "repos/$GH_REPO/rulesets") || { echo "::error::cannot list the rulesets of $GH_REPO"; exit 1; }
          id=$(printf '%s' "$list" | jq -r '[.[] | select(.name == "main")][0].id // empty')
          if [ -z "$id" ]; then
            echo "there is no ruleset named main in $GH_REPO" > ruleset/drift.txt
          else
            gh api "repos/$GH_REPO/rulesets/$id" > ruleset/live.json
            set +e
            go run ./tools/rulesetcheck -live ruleset/live.json > ruleset/drift.txt
            code=$?
            set -e
            if [ "$code" -gt 1 ]; then cat ruleset/drift.txt; exit "$code"; fi
          fi
          cat ruleset/drift.txt
          if [ -s ruleset/drift.txt ]; then echo drift > ruleset/result; else echo ok > ruleset/result; fi
          [ ! -s ruleset/drift.txt ] || { echo "::error title=Ruleset drift::the ruleset of main differs from docs/desenvolvimento/ambiente.md"; exit 1; }

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: ruleset
          path: |
            ruleset/result
            ruleset/drift.txt
          if-no-files-found: ignore

  # One issue labeled `ruleset` while the drift lasts: opened on the first
  # night, rewritten on the next ones, closed when the ruleset is the
  # documented one again. The only other job with write access; it runs no
  # repository code, just the gh CLI of the runner.
  ruleset-report:
    name: report ruleset drift
    needs: ruleset
    if: always() && needs.ruleset.result != 'skipped'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          name: ruleset
          path: ruleset

      - name: Open, update or close the ruleset issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          result=$(cat ruleset/result 2>/dev/null || echo error)
          title="ruleset drift: main"
          gh label create ruleset --description "Ruleset of main differs from the documented one" --color 5319E7 2>/dev/null || true
          number=$(gh issue list --label ruleset --state open --search "\"$title\" in:title" --json number,title \
            --jq "map(select(.title == \"$title\")) | first | .number // empty")
          case "$result" in
            drift)
              body="The ruleset of \`main\` differs from the one in docs/desenvolvimento/ambiente.md (nightly check, \`tools/rulesetcheck\`). Run: $RUN_URL

          \`\`\`
          $(cat ruleset/drift.txt)
          \`\`\`

          Change the ruleset or the document so they agree (the document is the source)."
              if [ -n "$number" ]; then
                gh issue edit "$number" --body "$body"
              else
                gh issue create --label ruleset --title "$title" --body "$body"
              fi
              ;;
            ok)
              if [ -n "$number" ]; then
                gh issue close "$number" --comment "The ruleset of main is the documented one again. Run: $RUN_URL"
              fi
              ;;
            *)
              echo "the check had no verdict (see the ruleset job); issues left as they are"
              ;;
          esac
