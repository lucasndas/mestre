# TEMPORARY probe, removed before the PR is ready: can the GITHUB_TOKEN of a
# workflow read the rulesets (the nightly ruleset job needs it)?
name: zz-ruleset-probe

on:
  pull_request:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: The nightly ruleset step, as is
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir ruleset
          echo error > ruleset/result
          : > ruleset/drift.txt
          list=$(gh api "repos/$GH_REPO/rulesets") || { echo "::error::cannot list the rulesets of $GH_REPO"; exit 1; }
          id=$(printf '%s' "$list" | jq -r '[.[] | select(.name == "main")][0].id // empty')
          echo "ruleset id: $id"
          gh api "repos/$GH_REPO/rulesets/$id" > ruleset/live.json
          go run ./tools/rulesetcheck -live ruleset/live.json
          echo "no drift"
