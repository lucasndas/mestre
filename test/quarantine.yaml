# Unstable tests (docs/qualidade/testes.md#quarentena). One entry per
# top-level Go test name; the runner skips them and lists them at the end.
# Default deadline: 14 days after "added"; an expired entry fails the full
# suite.
#
# tests:
#   - test: TestExample
#     issue: https://github.com/mestre-ia/mestre/issues/123
#     added: 2026-10-12
#     reason: what makes it unstable
tests:
  - test: TestTheCopiesOfTheScrollsReachTheWorktreeOfATower
    issue: https://github.com/mestre-ia/mestre/issues/354
    added: 2026-10-26
    reason: on Windows CI the copies of the scrolls did not reach the worktree of the Tower in time, in a PR that touched no scroll or Tower code
  - test: TestARequestForOneProviderTestsOnlyItAndReplacesItsPreviousResult
    issue: https://github.com/mestre-ia/mestre/issues/363
    added: 2026-10-26
    reason: on the Windows full suite of a PR that touched no conformance code the fake Claude Code step 4 did not see the denied pre_tool after 27 s
  - test: TestTheSweepEndsTheProcessesOfTheSession
    issue: https://github.com/mestre-ia/mestre/issues/369
    added: 2026-10-26
    reason: "on the Windows full suite of a PR that touched no winsvc code the sweep ended 2 processes of the session, not only the helper"
  - test: TestTheSweepDoesNotFailOnAProcessThatIsAlreadyEnding
    issue: https://github.com/mestre-ia/mestre/issues/369
    added: 2026-10-27
    reason: "on the Windows full suite of the merge queue of a PR that touched no winsvc code the sweep counted 2 processes for the one helper, the same as TestTheSweepEndsTheProcessesOfTheSession"
